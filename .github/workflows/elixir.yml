name: Elixir CI

# Validate every PR, including branches in a review stack.
on:
  push:
    branches: [ "main" ]
  pull_request:

# Sets the ENV `MIX_ENV` to `test` for running tests
env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    # Set up a Postgres DB service. By default, Phoenix applications
    # use Postgres. This creates a database for running tests.
    # Additional services can be defined here if required.
    services:
      db:
        image: postgis/postgis:17-3.5
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      # Specify the OTP and Elixir versions to use when building
      # and running the workflow steps.
      matrix:
        otp: ['29.0.3']       # Define the OTP version [required]
        elixir: ['1.20.2']    # Define the elixir version [required]
    steps:
    # Step: Setup Elixir + Erlang image as the base.
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}

    # Step: Check out the code.
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test JavaScript components
      run: npm test --prefix assets

    # Step: Copy test environment file
    - name: Setup test environment
      run: cp .test.env.example .test.env

    # Step: Define how to cache deps. Restores existing cache if present.
    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v3
      env:
        cache-name: cache-elixir-deps
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-

    # Step: Define how to cache the `_build` directory. After the first run,
    # this speeds up tests runs a lot. This includes not re-compiling our
    # project's downloaded deps every run.
    - name: Cache compiled build
      id: cache-build
      uses: actions/cache@v3
      env:
        cache-name: cache-compiled-build
      with:
        path: _build
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-
          ${{ runner.os }}-mix-

    # Step: Download project dependencies. If unchanged, uses
    # the cached version.
    - name: Install dependencies
      run: mix deps.get

    # Step: Compile the project treating any warnings as errors.
    # Customize this step if a different behavior is desired.
    - name: Compiles without warnings
      run: mix compile --warnings-as-errors

    # Step: Execute the tests.
    - name: Run tests
      run: mix test

    # Step: Check that the checked in code has already been formatted.
    # This step fails if something was found unformatted.
    # Customize this step as desired.
    - name: Check Formatting
      run: mix format --check-formatted

    # Step: Check that the checked in code has already been formatted.
    # This step fails if something was found unformatted.
    # Customize this step as desired.
    - name: Check Linting
      run: mix credo --strict

  # Run the dev onboarding flow (`mix ecto.setup`: create, migrate, seeds.exs,
  # dev_seeds.exs) against a fresh database. The seed scripts call resource
  # actions directly and refuse to run in MIX_ENV=test, so the test suite
  # can't catch them drifting from the actions they call — this job can.
  seeds:
    services:
      db:
        image: postgis/postgis:17-3.5
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    name: Seed on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    env:
      MIX_ENV: dev
    strategy:
      matrix:
        otp: ['29.0.3']
        elixir: ['1.20.2']
    steps:
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}

    - name: Checkout code
      uses: actions/checkout@v3

    # The example file works as-is: the placeholder Google Maps key makes
    # geocoding fail soft (warning + nil coordinates), which is exactly what
    # a fresh contributor without real credentials experiences.
    - name: Setup dev environment
      run: cp .dev.env.example .dev.env

    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v3
      env:
        cache-name: cache-elixir-deps
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-

    - name: Cache compiled build
      id: cache-build
      uses: actions/cache@v3
      env:
        cache-name: cache-compiled-dev-build
      with:
        path: _build
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Create, migrate, and seed the database
      run: mix ecto.setup

  browser:
    name: Browser scenarios (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: '29.0.3'
        elixir-version: '1.20.2'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: assets/package-lock.json
    - name: Cache browser job dependencies and compilation
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build/test
        key: ${{ runner.os }}-browser-otp29-elixir1.20-${{ hashFiles('mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-browser-otp29-elixir1.20-
    - name: Setup test environment
      run: cp .test.env.example .test.env
    - name: Install dependencies and asset tools
      run: |
        mix deps.get
        mix assets.setup
        npm ci --prefix assets
    - name: Install Chromium and system dependencies
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/_build/browser/browsers
      run: assets/node_modules/.bin/playwright install --with-deps chromium --only-shell
    - name: Run browser scenarios
      timeout-minutes: 2
      run: mix test.browser
    - name: Preserve first-attempt failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-failure-diagnostics
        path: |
          _build/browser/screenshots
          _build/browser/traces
        if-no-files-found: ignore
        retention-days: 7
