name: Verify dependency refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build release image without publishing
        run: docker build --tag huddlz-dependency-check .
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
      - run: cp .test.env.example .test.env
      - run: mix deps.get
      - run: mix precommit
      - name: Check precommit leaves tracked files unchanged
        run: git diff --exit-code
  unfiltered-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
      - run: mix local.hex 2.7.0 --force
      - name: Remove advisory ignore only in this disposable audit checkout
        run: sed -i 's/hex: \[ignore_advisories: \["EEF-CVE-2026-117656"\]\]/hex: []/' mix.exs
      - run: mix deps.get
      - name: Audit without repository exceptions
        run: mix hex.audit
