name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: Audit Hex dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'
      # Hex 2.5 includes security advisories in hex.audit.
      - name: Install Hex with security advisory support
        run: mix local.hex 2.5.1 --force
      - name: Fetch locked dependencies
        run: mix deps.get
      - name: Check for vulnerable or retired packages
        run: mix hex.audit
