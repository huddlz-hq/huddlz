name: Validate dependency release build
on:
  push:
    branches: [chore/dependencies-2026-10-26]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build release without publishing or deploying
        run: docker build --tag huddlz-dependency-check .
  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
