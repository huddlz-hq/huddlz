name: Verify dependency refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
      - run: mix deps.get
      - run: cp .test.env.example .test.env
      - run: mix precommit
      - run: git diff --exit-code
      - run: npm audit --prefix assets
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t huddlz-dependency-validation .
