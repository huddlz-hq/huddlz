name: Temporary production build validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-build:
    if: github.head_ref == 'micah/elixir-deps-update-4ee997'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the production image without publishing
        run: docker build --progress=plain --tag huddlz-dependency-validation:local .
