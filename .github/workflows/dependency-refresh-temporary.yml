name: Temporary dependency validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  precommit:
    if: github.head_ref == 'micah/elixir-deps-update-4ee997'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: postgis/postgis:16-3.4
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      HEX_HTTP_CONCURRENCY: 2
      HEX_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - run: cp .test.env.example .test.env
      - run: mix deps.get
      - run: mix precommit
      - run: mix ash.codegen --check
      - run: git diff --exit-code
